# ============================================================================
# DSH 干净「标准预设（外置人设 .txt 引用版）」模板
#
# 原理：
#   1. 挂载 `dsh-linux13-gateway/persona-file` 并开启 `complete: true`，
#      直接把 DSH 默认注入的编程助手身份段（You are an AI agent...）、全局规则段
#      等全部丢弃，系统提示词里【只有你外置 .txt 文件里的原版人设】！
#   2. 移除 `agent-instructions` 插件，防止工作区的 AGENTS.md / CLAUDE.md
#      作为 <system-reminder> 注入用户消息冲淡人设。
#   3. 完整保留 DSH 标准预设（standard）的全部原生工具（读写文件、终端、搜索、技能等）。
#   4. 外置 .txt 文件在每次发消息时动态重读，改完 .txt 保存后【下一条消息立即生效】，无需重启！
# ============================================================================
- insert:
    - id: preset-character
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: character
        name: 角色陪伴
        description: 干净角色预设：系统提示词 100% 来自外置人设 .txt 文件，改文件下一条消息即生效
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
          - id: persona-file
            name: 'dsh-linux13-gateway/persona-file'
            config:
              enabled: true
              complete: true
              files:
                - '/abs/path/to/人设.txt'
              order: 50
          # ↓↓↓ 以下保留 DSH 标准预设（standard）的全部工具能力（已剔除 agent-instructions）↓↓↓
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
