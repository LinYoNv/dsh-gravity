# ============================================================================
# dsh-linux13-gateway —— Linux 1.3 伪终端合成工具网关（DSH 插件组合层）
#
# 安装后自动在本地监听 127.0.0.1:8318 并转发至上游 OpenAI 兼容端点，
# 同时将内置的 `linux13-gateway` 跨环境部署技能注册到 ~/.dsh/skills/。
# 所有配置项均支持在 DSH「插件 → Linux 1.3 伪终端工具网关」表单中热修改。
# ============================================================================
- insert:
    - id: dsh-linux13-gateway
      name: 'dsh-linux13-gateway'
      config:
        enabled: true
        listenHost: '127.0.0.1'
        listenPort: 8318
        upstreamBaseUrl: 'http://127.0.0.1:8317'
        activationMarkers: '<output_contract>,<Role_Profile>,<role_profile>,[Linux13]'
        historyWindow: 32
        maxRefusalRetries: 2
        cloakedImageTools: 'nai_generate_image,generate_image,draw_image,paint_image'
        memoryPrefetchUrl: ''
        verbose: false
