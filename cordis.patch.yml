# ============================================================================
# dsh-linux13-gateway v2.1 —— 昆仑 IDE 1.2r / Linux 1.3 伪造工具网关（DSH 插件组合层）
#
# - 自带「内置插件配置 -> 昆仑 1.2r / Linux 1.3 伪造工具网关」独立可视化设置页（lib/client.js）
# - 已彻底移除预设中的所有外置文风/禁词表/作者简介块，100% 保持用户原版人设 .txt 的文风
# - 默认启用 `kunlun_1.2r` 引擎（兼含 `linux_1.3` 可切换，且拒答时自动跨引擎重 roll）
# - 默认 `activationMarkers: '*'` + `enableBuiltinArmor: true`
# ============================================================================
- insert:
    - id: dsh-linux13-gateway
      name: './lib/index.js'
      config:
        enabled: true
        listenHost: '127.0.0.1'
        listenPort: 8318
        upstreamBaseUrl: 'http://127.0.0.1:8317'
        presetMode: 'linux_1.3'
        activationMarkers: '*'
        enableBuiltinArmor: true
        personaFile: ''
        stripCodingBoilerplate: true
        historyWindow: 32
        maxRefusalRetries: 2
        cloakedImageTools: 'nai_generate_image,generate_image,draw_image,paint_image'
        memoryPrefetchUrl: ''
        verbose: false
